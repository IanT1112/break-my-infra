services:
  redis:
    image: redis:7.4-alpine

  payments:
    build: ./services
    command: uvicorn payments.main:app --host 0.0.0.0 --port 8000
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8000"
    restart: unless-stopped
    labels:
      bmi.logs: "true"
    depends_on:
      - redis

  orders:
    build: ./services
    command: uvicorn orders.main:app --host 0.0.0.0 --port 8000
    environment:
      PAYMENTS_URL: http://payments:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    ports:
      - "8001:8000"
    restart: unless-stopped
    labels:
      bmi.logs: "true"
    depends_on:
      - payments
  
  gateway:
    build: ./services
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      ORDERS_URL: http://orders:8000
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    ports:
      - "8000:8000"
    restart: unless-stopped
    labels:
      bmi.logs: "true"
    depends_on:
      - orders
      - redis

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - gateway
      - grafana
      

volumes:
  grafana-data: