events {}

http {
  include /etc/nginx/mime.types;
  server_tokens off;   # no revelar la versión de nginx

  # ─── Zonas de rate limiting (memoria compartida, por IP) ───
  limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=chaos:10m   rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  server {
    listen 80;

    limit_conn perip 20;   # máx. 20 conexiones simultáneas por IP
    limit_rate 500k;       # máx. 500 KB/s por conexión (protege el egress 💰)

    # El panel (archivos estáticos)
    location / {
      limit_req zone=general burst=40 nodelay;
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    # Botones de caos: muy restringidos
    location ~ ^/api/chaos/(traffic|errors|latency)$ {
      limit_req zone=chaos burst=2 nodelay;
      proxy_pass http://gateway:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resto de la API (status, etc.)
    location /api/ {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://gateway:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Grafana (al cargar pide muchos archivos de golpe → ráfaga grande)
    location /grafana/ {
      limit_req zone=general burst=100 nodelay;
      proxy_pass http://grafana:3000;
      proxy_set_header Host $http_host;
    }

    location /grafana/api/live/ {
      proxy_pass http://grafana:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
    }
  }
}