<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Break My Infra</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="layout">

    <!-- ═══════ Panel de control ═══════ -->
    <aside class="panel">
      <header class="hero">
        <p class="eyebrow">Break My Infra</p>
        <h1>Rompe el sistema.<br><span>Míralo recuperarse.</span></h1>
      </header>

      <!-- Por qué -->
      <section class="block">
        <h2 class="block-title">Contexto</h2>
        <div class="why">
          <button class="why-item" data-tip-key="devops" data-modal="devops">
            <span>¿Por qué DevOps?</span><i aria-hidden="true">›</i>
          </button>
          <button class="why-item" data-tip-key="project" data-modal="project">
            <span>¿Por qué este proyecto?</span><i aria-hidden="true">›</i>
          </button>
        </div>
      </section>

      <!-- Tecnologías -->
      <section class="block">
        <h2 class="block-title">Tecnologías</h2>
        <ul class="tech-list" id="tech-list"></ul>
      </section>

      <footer class="credits">
        Desarrollado por <b>Ian Tapia</b> ·
        <a href="https://github.com/IanT1112/break-my-infra" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </aside>

    <!-- ═══════ Monitoreo 2x2 ═══════ -->
    <section class="monitor">
      <div class="toolbar">
        <div class="actions">
          <p class="kicker">Prueba a romper un sistema</p>
          <div class="scenarios">
            <button class="chaos" data-scenario="traffic" title="40 req/s · satura el pool de la DB">
              <span>Pico de tráfico</span><span class="count" aria-hidden="true"></span>
            </button>
            <button class="chaos" data-scenario="errors" title="30% de los pagos fallan">
              <span>Inyectar errores</span><span class="count" aria-hidden="true"></span>
            </button>
            <button class="chaos" data-scenario="latency" title="+600–1200 ms por pago">
              <span>Base de datos lenta</span><span class="count" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="toolbar-right">
          <p class="notice" id="notice" aria-live="polite"></p>
          <span class="range">Últimos 5 minutos · refresco 5 s</span>
        </div>
      </div>
      <div class="card"><iframe id="grafana" title="Monitoreo: latencia, error rate, requests y logs"></iframe></div>
    </section>
  </main>

  <!-- Tooltip flotante -->
  <div class="tip" id="tip" role="tooltip" hidden></div>

  <!-- Ventana con efecto espejo -->
  <dialog class="glass" id="modal" aria-labelledby="modal-title">
    <button class="close" id="modal-close" aria-label="Cerrar">×</button>
    <p class="eyebrow" id="modal-eyebrow"></p>
    <h2 id="modal-title"></h2>
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <script src="/content.js"></script>
  <script src="/app.js"></script>
</body>
</html>
